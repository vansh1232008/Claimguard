# Optional. ClaimGuard runs without any of this - SQLite, an in-memory vector
# store and an in-memory graph are the defaults. Bring these up when you want
# the production backends:
#
#   docker compose up -d
#   cp .env.example .env     # then uncomment DATABASE_URL, QDRANT_URL, NEO4J_URI
#   python scripts/seed_db.py --reset

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claimguard
      POSTGRES_PASSWORD: claimguard
      POSTGRES_DB: claimguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/claimguard
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  qdrantdata:
  neo4jdata:
